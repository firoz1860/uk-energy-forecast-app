<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#0b1329"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.8"/>

  <!-- Wind turbine / Energy symbol -->
  <g transform="translate(32, 30)" filter="url(#glow)">
    <!-- Tower -->
    <path d="M-2,6 L-3,24 L3,24 L2,6 Z" fill="#94a3b8" />
    
    <!-- Central hub -->
    <circle cx="0" cy="0" r="4.5" fill="#f8fafc" />

    <!-- 3 Turbine Blades rotating -->
    <!-- Blade 1: Top -->
    <path d="M-1.5,0 C-4,-10 -1,-22 0,-24 C1,-22 4,-10 1.5,0 Z" fill="url(#grad)" />
    
    <!-- Blade 2: Bottom-Right (120 deg) -->
    <g transform="rotate(120)">
      <path d="M-1.5,0 C-4,-10 -1,-22 0,-24 C1,-22 4,-10 1.5,0 Z" fill="url(#grad)" />
    </g>

    <!-- Blade 3: Bottom-Left (240 deg) -->
    <g transform="rotate(240)">
      <path d="M-1.5,0 C-4,-10 -1,-22 0,-24 C1,-22 4,-10 1.5,0 Z" fill="url(#grad)" />
    </g>

    <!-- Hub inner dot -->
    <circle cx="0" cy="0" r="2" fill="#0b1329" />
  </g>
</svg>
