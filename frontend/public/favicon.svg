<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0b1329"/>
  <rect width="60" height="60" x="2" y="2" rx="12" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.8"/>

  <!-- Rotating Turbine -->
  <g transform="translate(32, 23)">
    <path d="M-1.5,5 L-2,15 L2,15 L1.5,5 Z" fill="#64748b" />
    <g filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
      <circle cx="0" cy="0" r="3.5" fill="#f8fafc" />
      <path d="M-1.2,0 C-3,-7 -1,-15 0,-17 C1,-15 3,-7 1.2,0 Z" fill="url(#grad)" />
      <g transform="rotate(120)">
        <path d="M-1.2,0 C-3,-7 -1,-15 0,-17 C1,-15 3,-7 1.2,0 Z" fill="url(#grad)" />
      </g>
      <g transform="rotate(240)">
        <path d="M-1.2,0 C-3,-7 -1,-15 0,-17 C1,-15 3,-7 1.2,0 Z" fill="url(#grad)" />
      </g>
      <circle cx="0" cy="0" r="1.5" fill="#0b1329" />
    </g>
  </g>

  <!-- Marquee horizontal scrolling text: UK WIND FORECAST ACCURACY -->
  <g clip-path="url(#textClip)">
    <clipPath id="textClip">
      <rect x="4" y="44" width="56" height="15" rx="3" />
    </clipPath>
    <rect x="4" y="44" width="56" height="15" rx="3" fill="#111c38" />
    
    <g>
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        from="56 0" 
        to="-220 0" 
        dur="6s" 
        repeatCount="indefinite" 
      />
      <text x="0" y="55" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="800" letter-spacing="0.5">
        UK WIND FORECAST ACCURACY • UK WIND FORECAST ACCURACY •
      </text>
    </g>
  </g>
</svg>
